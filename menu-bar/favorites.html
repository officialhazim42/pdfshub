PDFHub tools on the home page for quick access. This list stays in this browser.</p><div class="panel" style="margin-top:34px"><div class="activity" id="favoriteList"></div></div></main><script src="site-pages.js"></script><script>(function(){const list=document.getElementById('favoriteList');let items=[];try{items=JSON.parse(localStorage.getItem('pdfhub-favorites')||'[]')}catch{}list.innerHTML=items.length?items.map(url=>{const name=url.split('/').pop().replace('.html','').replace(/-/g,' ');return `<a class="activity-item" href="../${url}"><i class="fas fa-star"></i><span>${name}</span><small>Favorite</small></a>`}).join(''):'<div class="notice"><i class="fas fa-star"></i><span>No favorites yet. Use the star on a tool card on the home page.</span></div>'})();</script></body></html>
