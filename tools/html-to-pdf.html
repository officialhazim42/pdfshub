  const type=document.getElementById('inputType').value;

  const psize=document.getElementById('psize').value;
  const fullHtml=`<!DOCTYPE html><html><head><meta charset="UTF-8"><style>@page{size:${psize};margin:15mm}body{font-family:Arial,sans-serif;font-size:12pt;line-height:1.5}*{box-sizing:border-box}img{max-width:100%}</style><script src="shared.js"><\/script>
